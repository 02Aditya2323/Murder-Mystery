<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"
     aria-label="A seafront photograph: angled fort bastions along the shore, a square fort standing alone in the water, and a church bell tower on the rise behind.">
  <title>Recovered image, posted 22:21</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#AFC4CE"/>
      <stop offset="0.55" stop-color="#D6D6C8"/>
      <stop offset="1"   stop-color="#EBDFC8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8AA3AD"/>
      <stop offset="0.5" stop-color="#78929E"/>
      <stop offset="1"   stop-color="#5F7A88"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2B98F"/>
      <stop offset="1" stop-color="#A98F69"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B49C74"/>
      <stop offset="1" stop-color="#8A7352"/>
    </linearGradient>
    <linearGradient id="promenade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6B89F"/>
      <stop offset="1" stop-color="#9C8E76"/>
    </linearGradient>

    <!-- faded-print vignette -->
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2A2113" stop-opacity="0.42"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>

    <filter id="softHaze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- ───────────────────────── sky ───────────────────────── -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- thin tropical cloud, high and flat: this is a bright, dry daytime sky -->
  <g fill="#FFFFFF" opacity="0.5" filter="url(#softHaze)">
    <ellipse cx="300"  cy="150" rx="190" ry="26"/>
    <ellipse cx="430"  cy="178" rx="150" ry="19"/>
    <ellipse cx="1180" cy="120" rx="230" ry="30"/>
    <ellipse cx="1330" cy="156" rx="160" ry="20"/>
    <ellipse cx="760"  cy="206" rx="130" ry="15"/>
  </g>

  <!-- the sun is high: short, hard shadows below -->
  <circle cx="1240" cy="196" r="54" fill="#FFF6DC" opacity="0.55" filter="url(#softHaze)"/>

  <!-- ───────────── headland and church, far distance ───────────── -->
  <g opacity="0.72">
    <path d="M0 470 L120 452 L300 462 L470 438 L640 456 L700 470 L0 470 Z" fill="#9AA896"/>
    <!-- church on the rise: squat nave, square Portuguese bell tower, cross -->
    <g fill="#CBBFA6">
      <rect x="236" y="392" width="118" height="62"/>
      <path d="M236 392 L295 362 L354 392 Z"/>
      <rect x="356" y="344" width="40" height="110"/>     <!-- bell tower -->
      <path d="M352 344 L376 320 L400 344 Z"/>            <!-- tower cap -->
      <rect x="374" y="300" width="4" height="22"/>       <!-- cross upright -->
      <rect x="368" y="306" width="16" height="4"/>       <!-- cross arm -->
    </g>
    <g fill="#8E8166">
      <rect x="364" y="366" width="11" height="20"/>      <!-- belfry opening -->
      <rect x="380" y="366" width="11" height="20"/>
      <rect x="262" y="414" width="13" height="26"/>
      <rect x="288" y="414" width="13" height="26"/>
      <rect x="314" y="414" width="13" height="26"/>
    </g>
  </g>

  <!-- ───────────────────────── sea ───────────────────────── -->
  <rect x="0" y="470" width="1600" height="300" fill="url(#sea)"/>
  <g stroke="#A8BCC4" stroke-width="2" opacity="0.4">
    <path d="M60 520 h150 M300 512 h110 M520 530 h180 M820 516 h140 M1080 536 h190 M1340 522 h150"/>
    <path d="M140 572 h190 M420 586 h130 M700 566 h210 M1020 592 h160 M1300 574 h200"/>
    <path d="M90 640 h230 M420 660 h170 M760 634 h200 M1100 664 h210"/>
  </g>

  <!-- ───── the island battery: a square fort standing alone in the water ───── -->
  <g>
    <!-- reflection first, so the fort sits on it -->
    <g opacity="0.22">
      <rect x="848" y="516" width="148" height="46" fill="#6A5B41"/>
    </g>
    <rect x="848" y="430" width="148" height="86" fill="url(#stone)"/>
    <rect x="848" y="430" width="148" height="12" fill="#E0CCA6"/>
    <!-- crenellations along the top -->
    <g fill="#C3AA82">
      <rect x="852" y="416" width="18" height="16"/>
      <rect x="884" y="416" width="18" height="16"/>
      <rect x="916" y="416" width="18" height="16"/>
      <rect x="948" y="416" width="18" height="16"/>
      <rect x="972" y="416" width="18" height="16"/>
    </g>
    <!-- a round corner turret, and a short lighthouse on the seaward side -->
    <rect x="836" y="438" width="26" height="78" rx="4" fill="url(#stoneDark)"/>
    <rect x="982" y="438" width="26" height="78" rx="4" fill="url(#stoneDark)"/>
    <rect x="906" y="368" width="30" height="54" fill="#DCC9A4"/>
    <rect x="900" y="358" width="42" height="12" rx="3" fill="#8A7352"/>
    <g fill="#7E6A4C">
      <rect x="876" y="462" width="14" height="22"/>
      <rect x="912" y="462" width="14" height="22"/>
      <rect x="948" y="462" width="14" height="22"/>
    </g>
  </g>

  <!-- ─────── the shore fort: angled bastions, not round towers ─────── -->
  <g>
    <!-- curtain wall running out along the water -->
    <path d="M1030 612 L1600 568 L1600 700 L1030 700 Z" fill="url(#stoneDark)"/>
    <path d="M1030 612 L1600 568 L1600 592 L1030 636 Z" fill="#DCC6A0"/>

    <!-- Bastion one. Flat-topped and battered: the walls lean inward as they
         rise, and the two faces meet at a blunt angle pointing seaward. That
         angled, sloping plan is the thing that dates the fort, so it has to be
         legible at a glance and must not read as a pitched roof. -->
    <path d="M1108 700 L1134 590 L1196 574 L1258 590 L1284 700 Z" fill="url(#stone)"/>
    <!-- the seaward face catches the light, the flank is in shadow -->
    <path d="M1196 574 L1258 590 L1284 700 L1196 700 Z" fill="url(#stoneDark)" opacity="0.55"/>
    <!-- parapet walk and merlons along the flat top -->
    <path d="M1134 590 L1196 574 L1258 590 L1258 600 L1196 584 L1134 600 Z" fill="#E4D0AB"/>
    <g fill="#C8B088">
      <rect x="1140" y="578" width="16" height="14" transform="rotate(-8 1148 585)"/>
      <rect x="1178" y="568" width="16" height="14" transform="rotate(-3 1186 575)"/>
      <rect x="1216" y="572" width="16" height="14" transform="rotate(5 1224 579)"/>
      <rect x="1248" y="582" width="16" height="14" transform="rotate(9 1256 589)"/>
    </g>
    <!-- gun embrasures cut low in the face -->
    <g fill="#7E6A4C">
      <rect x="1152" y="636" width="20" height="15"/>
      <rect x="1188" y="630" width="20" height="15"/>
      <rect x="1226" y="638" width="20" height="15"/>
    </g>

    <!-- Bastion two, further along the wall, same plan seen smaller -->
    <path d="M1392 700 L1414 566 L1468 552 L1522 566 L1544 700 Z" fill="url(#stone)"/>
    <path d="M1468 552 L1522 566 L1544 700 L1468 700 Z" fill="url(#stoneDark)" opacity="0.55"/>
    <path d="M1414 566 L1468 552 L1522 566 L1522 576 L1468 562 L1414 576 Z" fill="#E4D0AB"/>
    <g fill="#C8B088">
      <rect x="1420" y="556" width="14" height="12" transform="rotate(-7 1427 562)"/>
      <rect x="1456" y="548" width="14" height="12"/>
      <rect x="1494" y="554" width="14" height="12" transform="rotate(7 1501 560)"/>
    </g>
    <g fill="#7E6A4C">
      <rect x="1430" y="612" width="18" height="14"/>
      <rect x="1466" y="606" width="18" height="14"/>
      <rect x="1502" y="614" width="18" height="14"/>
    </g>

    <!-- sloped stone apron where the wall meets the water -->
    <path d="M1030 700 L1600 700 L1600 724 L1030 724 Z" fill="#7E6A4C"/>
  </g>

  <!-- waterline foam against the fort -->
  <g fill="#D6E0DF" opacity="0.6">
    <ellipse cx="1140" cy="722" rx="90" ry="7"/>
    <ellipse cx="1330" cy="726" rx="120" ry="6"/>
    <ellipse cx="1520" cy="720" rx="80" ry="7"/>
    <ellipse cx="922"  cy="518" rx="86" ry="5"/>
  </g>

  <!-- ─────────────── promenade, foreground ─────────────── -->
  <rect x="0" y="724" width="1600" height="276" fill="url(#promenade)"/>
  <!-- paving joints -->
  <g stroke="#8D805F" stroke-width="2" opacity="0.5">
    <path d="M0 790 H1600 M0 862 H1600 M0 940 H1600"/>
    <path d="M120 724 V1000 M380 724 V1000 M700 724 V1000 M1010 724 V1000 M1320 724 V1000"/>
  </g>

  <!-- sea wall and railing along the promenade edge -->
  <rect x="0" y="708" width="1600" height="34" fill="#B1A287"/>
  <rect x="0" y="708" width="1600" height="8" fill="#D3C4A6"/>
  <g fill="#6E6450">
    <rect x="0" y="668" width="1600" height="7"/>
    <rect x="40"   y="668" width="9" height="46"/>
    <rect x="200"  y="668" width="9" height="46"/>
    <rect x="360"  y="668" width="9" height="46"/>
    <rect x="520"  y="668" width="9" height="46"/>
    <rect x="680"  y="668" width="9" height="46"/>
    <rect x="840"  y="668" width="9" height="46"/>
    <rect x="1000" y="668" width="9" height="46"/>
  </g>

  <!-- hard midday shadows cast short and sharp onto the paving -->
  <g fill="#6E6450" opacity="0.3">
    <rect x="46"   y="714" width="9" height="26"/>
    <rect x="206"  y="714" width="9" height="26"/>
    <rect x="366"  y="714" width="9" height="26"/>
    <rect x="526"  y="714" width="9" height="26"/>
    <rect x="686"  y="714" width="9" height="26"/>
    <rect x="846"  y="714" width="9" height="26"/>
    <rect x="1006" y="714" width="9" height="26"/>
  </g>

  <!-- a palm, because this is a tropical seafront -->
  <g>
    <path d="M250 1000 L262 806 L286 806 L274 1000 Z" fill="#7A6A4E"/>
    <g fill="#6E7C54">
      <path d="M274 806 C 210 760, 170 772, 142 800 C 190 772, 236 780, 274 806 Z"/>
      <path d="M274 806 C 232 742, 240 706, 262 678 C 252 716, 262 762, 274 806 Z"/>
      <path d="M274 806 C 326 748, 372 746, 404 766 C 352 754, 308 774, 274 806 Z"/>
      <path d="M274 806 C 316 760, 344 712, 346 676 C 330 722, 300 768, 274 806 Z"/>
      <path d="M274 806 C 228 814, 186 844, 166 876 C 206 838, 244 816, 274 806 Z"/>
    </g>
    <ellipse cx="300" cy="1000" rx="120" ry="20" fill="#6E6450" opacity="0.22"/>
  </g>

  <!-- faded-print finish -->
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
  <rect width="1600" height="1000" fill="#C08A3E" opacity="0.07"/>
</svg>
